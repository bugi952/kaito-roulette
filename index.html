<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>할 일 보드</title>
  <style>
    :root{
      --bg:#f7f9fc;
      --card:#ffffff;
      --accent:#6c5ce7;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e5e7eb;
      --shadow:0 12px 30px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:radial-gradient(1200px 600px at 50% -10%, #eef2ff, var(--bg));
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color:var(--text);
      display:flex;
      justify-content:center;
      padding:38px 18px 48px;
    }
    main{ width:min(1080px, 100%); }
    h1{ margin:0 0 12px; font-size:32px; font-weight:900; letter-spacing:-0.02em; }
    .subtitle{ margin:0 0 24px; color:var(--muted); font-size:16px; }
    .input-bar{ display:flex; gap:12px; align-items:center; margin-bottom:20px; }
    .input-bar input{
      flex:1;
      padding:14px 16px;
      border-radius:14px;
      border:1px solid var(--border);
      font-size:16px;
      outline:none;
      transition:border-color .2s, box-shadow .2s;
      background:#fff;
    }
    .input-bar input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,92,231,.18); }
    .input-bar button{
      padding:14px 22px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg, var(--accent), #4b39c5);
      color:#fff;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:transform .08s, filter .15s;
    }
    .input-bar button:hover{ filter:brightness(1.05); }
    .input-bar button:active{ transform:translateY(1px) scale(.99); }
    .board{
      display:grid;
      grid-template-columns:repeat(2, minmax(280px,1fr));
      gap:16px;
      align-items:start;
    }
    @media (max-width: 720px){
      .board{ grid-template-columns:1fr; }
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px 14px 12px;
      box-shadow:var(--shadow);
      display:flex;
      gap:12px;
      align-items:flex-start;
      cursor:grab;
      transition:transform .1s ease, box-shadow .1s ease, border-color .2s;
      position:relative;
    }
    .card:active{ cursor:grabbing; }
    .card.dragging{ opacity:.75; transform:scale(.98); box-shadow:0 6px 18px rgba(0,0,0,.12); }
    .card.drop-target{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,92,231,.18); }
    .checkbox{
      margin-top:3px;
      width:20px;height:20px;
      accent-color:var(--accent);
      cursor:pointer;
      flex-shrink:0;
    }
    .content{ flex:1; }
    .title{ margin:0; font-size:17px; font-weight:800; }
    .title.done{ text-decoration:line-through; color:var(--muted); }
    .meta{ margin-top:6px; font-size:13px; color:var(--muted); }
    .actions{ display:flex; gap:10px; }
    .pill{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background:#f4f5fb;
      color:var(--muted);
      border:1px solid var(--border);
    }
    .delete-btn{
      border:none;
      background:none;
      color:#ef4444;
      font-weight:700;
      cursor:pointer;
      padding:6px 10px;
      border-radius:10px;
      transition:background .15s;
    }
    .delete-btn:hover{ background:rgba(239,68,68,.08); }
    .empty{
      grid-column:1 / -1;
      text-align:center;
      padding:36px 18px;
      color:var(--muted);
      border:1px dashed var(--border);
      border-radius:12px;
      background:rgba(255,255,255,.6);
    }
  </style>
</head>
<body>
  <main>
    <h1>오늘의 할 일 보드</h1>
    <p class="subtitle">마우스로 카드를 끌어 두 칸짜리 보드 위에서 자유롭게 배치하세요.</p>

    <form class="input-bar" id="todoForm">
      <input id="todoInput" type="text" placeholder="할 일을 입력하세요" autocomplete="off" required />
      <button type="submit">추가</button>
    </form>

    <section class="board" id="board" aria-live="polite"></section>
  </main>

  <script>
    const form = document.getElementById('todoForm');
    const input = document.getElementById('todoInput');
    const board = document.getElementById('board');

    const STORAGE_KEY = 'todo-board-items';
    let todos = loadTodos();
    let dragIndex = null;

    function loadTodos(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      }catch(err){
        console.warn('로컬스토리지에서 할 일을 불러오지 못했습니다.', err);
        return [];
      }
    }

    function saveTodos(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function render(){
      board.innerHTML = '';
      if (!todos.length){
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '아직 추가된 할 일이 없습니다.';
        board.appendChild(empty);
        return;
      }

      todos.forEach((todo, index)=>{
        const card = document.createElement('article');
        card.className = 'card';
        card.draggable = true;
        card.dataset.index = index;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'checkbox';
        checkbox.checked = !!todo.done;
        checkbox.addEventListener('change', ()=>{
          todos[index].done = checkbox.checked;
          saveTodos();
          render();
        });

        const content = document.createElement('div');
        content.className = 'content';

        const title = document.createElement('p');
        title.className = 'title' + (todo.done ? ' done' : '');
        title.textContent = todo.text;

        const meta = document.createElement('div');
        meta.className = 'meta';
        const date = new Date(todo.createdAt);
        meta.textContent = `${date.toLocaleDateString()} · ${date.toLocaleTimeString()}`;

        content.appendChild(title);
        content.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'actions';
        const badge = document.createElement('span');
        badge.className = 'pill';
        badge.textContent = '카드를 끌어 순서 변경';
        actions.appendChild(badge);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'delete-btn';
        delBtn.textContent = '삭제';
        delBtn.addEventListener('click', ()=>{
          todos.splice(index, 1);
          saveTodos();
          render();
        });
        actions.appendChild(delBtn);

        card.appendChild(checkbox);
        card.appendChild(content);
        card.appendChild(actions);

        attachDragEvents(card);
        board.appendChild(card);
      });
    }

    function attachDragEvents(card){
      card.addEventListener('dragstart', (e)=>{
        dragIndex = Number(card.dataset.index);
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      card.addEventListener('dragend', ()=>{
        dragIndex = null;
        card.classList.remove('dragging');
        clearDropTargets();
      });

      card.addEventListener('dragover', (e)=>{
        e.preventDefault();
        const targetIndex = Number(card.dataset.index);
        if (dragIndex === null || dragIndex === targetIndex) return;
        highlightTarget(card);
      });

      card.addEventListener('dragleave', ()=>{
        card.classList.remove('drop-target');
      });

      card.addEventListener('drop', (e)=>{
        e.preventDefault();
        const targetIndex = Number(card.dataset.index);
        if (dragIndex === null || dragIndex === targetIndex) return;
        moveTodo(dragIndex, targetIndex);
        clearDropTargets();
      });
    }

    function clearDropTargets(){
      board.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
    }

    function highlightTarget(el){
      clearDropTargets();
      el.classList.add('drop-target');
    }

    function moveTodo(from, to){
      const [item] = todos.splice(from, 1);
      todos.splice(to, 0, item);
      saveTodos();
      render();
    }

    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ text, done:false, createdAt:Date.now() });
      saveTodos();
      render();
      input.value='';
      input.focus();
    });

    render();
  </script>
</body>
</html>
